name: speedmilhas-qa

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: speedmilhas
      POSTGRES_PASSWORD: speedmilhas
      POSTGRES_DB: speedmilhas
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U speedmilhas -d speedmilhas']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  mock-suppliers:
    build: ./mock-suppliers
    restart: unless-stopped
    ports:
      - '${MOCK_SUPPLIERS_PORT:-4000}:4000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  api:
    build: ./api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://speedmilhas:speedmilhas@postgres:5432/speedmilhas?schema=public
      SUPPLIERS_BASE_URL: http://mock-suppliers:4000
      PORT: 3000
    ports:
      - '${API_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      mock-suppliers:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-3000}
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-3001}:3001'
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
